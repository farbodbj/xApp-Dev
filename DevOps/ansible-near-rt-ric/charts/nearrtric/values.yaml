################################################################################
# Near-RT RIC helm values for the nearrtric umbrella chart.
#
# Derived from the O-RAN ric-dep RECIPE_EXAMPLE/example_recipe_latest_stable.yaml
# recipe, but with every component override double-nested under the subchart's
# own name (e.g. rtmgr: rtmgr: image: ...). The subcharts in
# new-installer/helm/charts/nearrtric/* read .Values.<chartname>.* from their own
# defaults, while helm routes umbrella-level overrides into the subchart's root
# scope, so a single-nested override never reaches the templates.
################################################################################

#-------------------------------------------------------------------------
# Global common setting
#-------------------------------------------------------------------------

common:
  releasePrefix: r4
# If a local docker registry is used, please specify it using the following option
#  localregistry: nexus3.o-ran-sc.org:10004

# Change the overall image pull policy using the following option
#  pullpolicy: IfNotPresent

# Change the namespaces using the following options
#  namespace:
#    aux: ricaux
#    platform: ricplt
#    xapp: ricxapp
#    infra: ricinfra

# ricip should be the ingress controller listening IP for the platform cluster
# auxip should be the ingress controller listening IP for the AUX cluster
extsvcplt:
  ricip: "10.0.0.1"
  auxip: "10.0.0.1"


# Specify the docker registry credential using the following
# The release and staging LF repos' credentials have already been included.
# Please do not create duplicated entries
#docker-credential:
#  enabled: true
#  credential:
#    SOME_KEY_NAME:
#      registry: ""
#      credential:
#        user: ""
#        password: ""
#        email: ""

prometheus:
  enabled: true

a1mediator:
  a1mediator:
    image:
      registry: "nexus3.o-ran-sc.org:10002/o-ran-sc"
      name: ric-plt-a1
      tag: 3.2.3
    rmr_timeout_config:
      a1_rcv_retry_times: 20
      ins_del_no_resp_ttl: 5
      ins_del_resp_ttl: 10

appmgr:
  appmgr:
    image:
      init:
        registry: "nexus3.o-ran-sc.org:10002/o-ran-sc"
        name: it-dep-init
        tag: 0.0.1
      appmgr:
        registry: "nexus3.o-ran-sc.org:10002/o-ran-sc"
        name: ric-plt-appmgr
        tag: 0.5.10
      chartmuseum:
        registry: "docker.io"
        name: chartmuseum/chartmuseum
        tag: v0.8.2


dbaas:
  dbaas:
    image:
      registry: "nexus3.o-ran-sc.org:10002/o-ran-sc"
      name: ric-plt-dbaas
      tag: 0.6.5
    enableHighAvailability: false
    # Enable pod anti affinity only if you have more than 3 k8s nodes
    enablePodAntiAffinity: false


e2mgr:
  e2mgr:
    image:
      registry: "nexus3.o-ran-sc.org:10002/o-ran-sc"
      name: ric-plt-e2mgr
      tag: 6.0.8
    privilegedmode: false
    globalRicId:
      ricId: "AACCE"
      mcc: "310"
      mnc: "411"
    rnibWriter:
      stateChangeMessageChannel: RAN_CONNECTION_STATUS_CHANGE
      ranManipulationMessageChannel: RAN_MANIPULATION

e2term:
  e2term:
    alpha:
      image:
        registry: "nexus3.o-ran-sc.org:10002/o-ran-sc"
        name: ric-plt-e2
        tag: 6.0.8
      privilegedmode: false
      hostnetworkmode: false
      env:
        print: "1"
        messagecollectorfile: "/data/outgoing/"
      dataVolSize: 100Mi
      storageClassName: local-storage
      pizpub:
        enabled: false


jaegeradapter:
  jaegeradapter:
    image:
      registry: "docker.io"
      name: jaegertracing/all-in-one
      tag: 1.12

rtmgr:
  rtmgr:
    image:
      registry: "nexus3.o-ran-sc.org:10002/o-ran-sc"
      name: ric-plt-rtmgr
      tag: 0.9.7

submgr:
  submgr:
    image:
      registry: "nexus3.o-ran-sc.org:10002/o-ran-sc"
      name: ric-plt-submgr
      tag: 0.10.4

vespamgr:
  vespamgr:
    image:
      registry: "nexus3.o-ran-sc.org:10002/o-ran-sc"
      name: ric-plt-vespamgr
      tag: 0.7.5
    prometheusurl: "http://r4-infrastructure-prometheus-server.ricplt"

o1mediator:
  o1mediator:
    image:
      registry: "nexus3.o-ran-sc.org:10002/o-ran-sc"
      name: ric-plt-o1
      tag: 0.6.4


alarmmanager:
  alarmmanager:
    image:
      registry: "nexus3.o-ran-sc.org:10002/o-ran-sc"
      name: ric-plt-alarmmanager
      tag: 0.5.17

influxdb:
  image:
    registry: "influxdb"
    name: influxdb
    tag: "2.2.0-alpine"
