- name: Install Python prerequisites
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
  ansible.builtin.apt:
    name:
      - python3-full
      - python3-venv
    state: present
    update_cache: true

- name: Create Python virtual environment
  vars:
    ansible_python_interpreter: /usr/bin/python3
  ansible.builtin.command:
    cmd: python3 -m venv --system-site-packages /home/ubuntu/k8s-venv
    creates: /home/ubuntu/k8s-venv/bin/pip

- name: Install Python libraries into the venv
  vars:
    ansible_python_interpreter: /usr/bin/python3
  ansible.builtin.pip:
    name:
      - setuptools
      - packaging
      - pyyaml
      - kubernetes==37.0.2
      - openshift
    virtualenv: /home/ubuntu/k8s-venv/

- name: Set the venv for everyone
  ansible.builtin.set_fact:
    ansible_python_interpreter: /home/ubuntu/k8s-venv/bin/python
