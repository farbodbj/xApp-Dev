---

- name: Install ChartMuseum
  hosts: k8s-master
  remote_user: "{{ ansible_user }}"

  tasks:
      - name: Install Python prerequisites
        become: true
        vars:
          ansible_python_interpreter: /usr/bin/python3
        ansible.builtin.apt:
          name:
            - python3-full
            - python3-venv
          state: present
          update_cache: true

      - name: Create Python virtual environment
        vars:
          ansible_python_interpreter: /usr/bin/python3
        ansible.builtin.command:
          cmd: python3 -m venv /home/ubuntu/k8s-venv
          creates: /home/ubuntu/k8s-venv/bin/python

      - name: Install Python libraries into the venv
        vars:
          ansible_python_interpreter: /home/ubuntu/k8s-venv/bin/python
        ansible.builtin.pip:
          name:
            - setuptools
            - packaging
            - pyyaml
            - kubernetes
            - openshift

      - name: Create namespace
        vars:
          ansible_python_interpreter: /home/ubuntu/k8s-venv/bin/python
        kubernetes.core.k8s:
          kubeconfig: "{{ kubeconfig_path }}"
          state: present
          definition:
            apiVersion: v1
            kind: Namespace
            metadata:
              name: chartmuseum

      - name: Copy chart manifests and values to the master
        ansible.builtin.copy:
          src: "{{ playbook_dir }}/charts/chartmuseum/{{ item }}"
          dest: "/home/ubuntu/chartmuseum/{{ item }}"
          mode: '0644'
        loop:
          - storage.yaml
          - values.yaml

      - name: Apply storage manifests
        vars:
          ansible_python_interpreter: /home/ubuntu/k8s-venv/bin/python
        kubernetes.core.k8s:
          kubeconfig: "{{ kubeconfig_path }}"
          state: present
          src: "/home/ubuntu/chartmuseum/storage.yaml"

      - name: Add Helm repo
        kubernetes.core.helm_repository:
          name: chartmuseum
          repo_url: https://chartmuseum.github.io/charts

      - name: Install / upgrade ChartMuseum
        kubernetes.core.helm:
          kubeconfig: "{{ kubeconfig_path }}"
          name: chartmuseum
          chart_ref: chartmuseum/chartmuseum
          release_namespace: chartmuseum
          update_repo_cache: true
          values_files:
            - "/home/ubuntu/chartmuseum/values.yaml"
          wait: true



- name: Create ChartMuseum data directory
  hosts: k8s-worker1
  remote_user: "{{ ansible_user }}"

  tasks:
    - name: Deploy ChartMuseum
      block:
        - name: Create chartmuseum data directory
          become: true
          ansible.builtin.file:
            path: /data/chartmuseum
            state: directory
            mode: '0755'
            owner: "{{ ansible_user }}"
            group: "{{ ansible_user }}"
